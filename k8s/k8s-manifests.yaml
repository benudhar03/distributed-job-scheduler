# -------------------------
# Namespace
# -------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: ar-scheduling
  labels:
    name: ar-scheduling
---
# -------------------------
# Secrets (store sensitive values)
# Replace the base64 values or create via kubectl create secret generic ...
# Example (recommended):
# kubectl -n ar-scheduling create secret generic ar-scheduling-secret \
#   --from-literal=mongo.username=<user> --from-literal=mongo.password=<pass> \
#   --from-literal=kafka.username=<user> --from-literal=kafka.password=<pass>
# -------------------------
apiVersion: v1
kind: Secret
metadata:
  name: ar-scheduling-secret
  namespace: ar-scheduling
type: Opaque
data:
  # Base64-encoded placeholders (replace these)
  mongo.username: bXltb25nby11c2Vy
  mongo.password: c29tZS1zZWNyZXQtU3RyaW5n
  kafka.username: a3FfdXNlcg==
  kafka.password: c2VjdXJlLWthZmthLXBhc3M=
---
# -------------------------
# ConfigMap (non-sensitive configuration)
# Use Spring Boot relaxed binding environment variables.
# Keys here will become environment variables in the Deployment.
# -------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: ar-scheduling-config
  namespace: ar-scheduling
data:
  # Spring profile to use by default (can be overridden)
  SPRING_PROFILES_ACTIVE: "prod"

  # Kafka/Mongo hosts (non-sensitive parts)
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "prod-kafka.company.com:9092"
  SPRING_DATA_MONGODB_URI: "mongodb://prod-mongo.company.com:27017/scheduling_db"

  # Spring application name (optional)
  SPRING_APPLICATION_NAME: "ar-scheduling-service"

  # App specific properties (relaxed-binding; Spring Boot will map)
  APP_SCHEDULING_MAX_FUTURE_SCHEDULE_DAYS: "365"
  APP_SCHEDULING_MAX_RETRY_ATTEMPTS: "3"
  APP_SCHEDULING_RETRY_DELAY_MS: "5000"

  # Kafka topic names (exposed here for visibility/change without rebuilding image)
  APP_KAFKA_TOPICS_TASK_EXECUTION: "ar-task-execution-topic"
  APP_KAFKA_TOPICS_TASK_COMPLETION: "ar-task-completion-topic"
  APP_KAFKA_TOPICS_TASK_STATUS_UPDATE: "ar-task-status-update-topic"
  APP_KAFKA_TOPICS_TASK_RETRY: "ar-task-retry-topic"

  # Management/actuator path (if you want to override)
  MANAGEMENT_ENDPOINTS_WEB_BASE_PATH: "/actuator"

  # JVM options (merge with container JAVA_OPTS if needed)
  JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
---
# -------------------------
# Deployment
# -------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ar-scheduling-deployment
  namespace: ar-scheduling
  labels:
    app: ar-scheduling
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ar-scheduling
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ar-scheduling
    spec:
      # Optional serviceAccountName if you need RBAC
      # serviceAccountName: ar-scheduling-sa
      securityContext:
        fsGroup: 1000
      containers:
        - name: ar-scheduling
          # Replace with your actual image (registry/path:tag)
          image: registry.example.com/ar-scheduling-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Resources - tune as per your environment
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          # Environment from ConfigMap and Secret
          envFrom:
            - configMapRef:
                name: ar-scheduling-config
            - secretRef:
                name: ar-scheduling-secret
          # If you want custom mappings or non-relaxed names, declare individually:
          env:
            # Map mongo credentials into Spring expected properties using relaxed binding:
            - name: SPRING_DATA_MONGODB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ar-scheduling-secret
                  key: mongo.username
            - name: SPRING_DATA_MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ar-scheduling-secret
                  key: mongo.password

            # (Optional) Pass the management base path
            - name: MANAGEMENT_ENDPOINTS_WEB_BASE_PATH
              valueFrom:
                configMapKeyRef:
                  name: ar-scheduling-config
                  key: MANAGEMENT_ENDPOINTS_WEB_BASE_PATH

            # Example: override spring.kafka properties with secret-backed user/pass if required
            - name: SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: ar-scheduling-secret
                  key: kafka.username
              # Note: If you need a combined SASL string, create it via a pre-deploy script or use a mounted file.

            # Ensure JAVA_OPTS present
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: ar-scheduling-config
                  key: JAVA_OPTS

          # Liveness / Readiness probes using actuator
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5

          # If you want to pass JVM opts to container entrypoint, image should honor JAVA_TOOL_OPTIONS / JAVA_OPTS
          # If the JAR expects a config file path, set SPRING_CONFIG_LOCATION env var here (example commented)
          # - name: SPRING_CONFIG_LOCATION
          #   value: "classpath:/,file:/config/"

          # Security: run as non-root at container level
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false

          # Optional: mount volumes (e.g., for log persistence or external configs)
          # volumeMounts:
          #   - name: app-logs
          #     mountPath: /var/log/ar-scheduling
      # volumes:
      #   - name: app-logs
      #     emptyDir: {}
---
# -------------------------
# Service (ClusterIP)
# -------------------------
apiVersion: v1
kind: Service
metadata:
  name: ar-scheduling-service
  namespace: ar-scheduling
  labels:
    app: ar-scheduling
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: ar-scheduling
---
# -------------------------
# (Optional) Horizontal Pod Autoscaler example
# -------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ar-scheduling-hpa
  namespace: ar-scheduling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ar-scheduling-deployment
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
