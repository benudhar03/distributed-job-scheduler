apiVersion: v1
kind: Namespace
metadata:
  name: distributed-job-scheduler
  labels:
    app.kubernetes.io/name: distributed-job-scheduler
    app.kubernetes.io/part-of: distributed-job-scheduler

---
apiVersion: v1
kind: Secret
metadata:
  name: distributed-job-scheduler-secret
  namespace: distributed-job-scheduler
  labels:
    app.kubernetes.io/name: distributed-job-scheduler
type: Opaque
stringData:
  mongo.username: "REPLACE_ME"
  mongo.password: "REPLACE_ME"
  kafka.username: "REPLACE_ME"
  kafka.password: "REPLACE_ME"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: distributed-job-scheduler-config
  namespace: distributed-job-scheduler
  labels:
    app.kubernetes.io/name: distributed-job-scheduler
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_APPLICATION_NAME: "distributed-job-scheduler"

  SPRING_DATA_MONGODB_URI: "mongodb://prod-mongo.company.com:27017/scheduling_db"

  SPRING_KAFKA_BOOTSTRAP_SERVERS: "prod-kafka.company.com:9092"

  SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: "SASL_SSL"
  SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: "PLAIN"

  APP_SCHEDULING_MAX_FUTURE_SCHEDULE_DAYS: "365"
  APP_SCHEDULING_MAX_RETRY_ATTEMPTS: "3"
  APP_SCHEDULING_RETRY_DELAY_MS: "5000"

  APP_KAFKA_TOPICS_TASK_EXECUTION: "distributed-job-scheduler-task-execution"
  APP_KAFKA_TOPICS_TASK_COMPLETION: "distributed-job-scheduler-task-completion"
  APP_KAFKA_TOPICS_TASK_STATUS_UPDATE: "distributed-job-scheduler-task-status-update"
  APP_KAFKA_TOPICS_TASK_RETRY: "distributed-job-scheduler-task-retry"

  MANAGEMENT_ENDPOINTS_WEB_BASE_PATH: "/actuator"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: distributed-job-scheduler
  namespace: distributed-job-scheduler
  labels:
    app.kubernetes.io/name: distributed-job-scheduler
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/part-of: distributed-job-scheduler
spec:

  replicas: 3

  selector:
    matchLabels:
      app.kubernetes.io/name: distributed-job-scheduler

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  template:

    metadata:
      labels:
        app.kubernetes.io/name: distributed-job-scheduler
        app.kubernetes.io/component: scheduler

    spec:

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:

        - name: distributed-job-scheduler

          image: registry.example.com/distributed-job-scheduler:1.0.0

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:

            - configMapRef:
                name: distributed-job-scheduler-config

          env:

            - name: SPRING_DATA_MONGODB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: distributed-job-scheduler-secret
                  key: mongo.username

            - name: SPRING_DATA_MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: distributed-job-scheduler-secret
                  key: mongo.password

            - name: SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: distributed-job-scheduler-secret
                  key: kafka.jaas.config

            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:+UseContainerSupport
                -XX:MaxRAMPercentage=75.0
                -XX:+UseG1GC
                -XX:MaxGCPauseMillis=200

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1000m"
              memory: "2Gi"

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: distributed-job-scheduler
  namespace: distributed-job-scheduler
  labels:
    app.kubernetes.io/name: distributed-job-scheduler
spec:
  type: ClusterIP

  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

  selector:
    app.kubernetes.io/name: distributed-job-scheduler

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: distributed-job-scheduler-hpa
  namespace: distributed-job-scheduler
  labels:
    app.kubernetes.io/name: distributed-job-scheduler
spec:

  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: distributed-job-scheduler

  minReplicas: 3
  maxReplicas: 10

  behavior:

    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
